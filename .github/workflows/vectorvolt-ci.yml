name: VectorVolt CI

on:
  push:
    branches: [main]
    tags: ["vectorvolt-v*"]
  pull_request:
    paths:
      - "vectorvolt/**"
      - ".github/workflows/vectorvolt-ci.yml"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # .cargo/config.toml points CC at MSVC cl.exe (force = false); C deps
  # such as zstd-sys need the system compiler on Linux.
  CC: gcc
  CXX: g++
  # The ubuntu-latest runner has 2 vCPUs and ~7 GB RAM.  vectorvolt-net
  # generates 109 integration-test binaries; linking them all in parallel
  # exhausts the linker's address space (SIGBUS / Bus error).
  #
  # CARGO_PROFILE_DEV_DEBUG=0 strips debug info from test binaries — the
  # dominant driver of linker RSS — cutting peak memory by ~70%.
  # CARGO_BUILD_JOBS=2 caps parallel link slots to the available cores.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_BUILD_JOBS: "2"

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ld dies with SIGBUS when its mmap'd output file can't be backed
      # (full disk) or memory runs out.  ~500 test binaries on top of the
      # cached target/ dir fill the ~14 GB free on the runner, so reclaim
      # space from preinstalled toolchains we never use and add swap.
      - name: Free disk space and add swap
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo swapoff -a || true
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          df -h /
          free -h

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # Explicit, even though the @stable ref implies it. The action reads
          # its default from action.yml at the resolved ref; when that ref is a
          # moving branch, an upstream change can leave the input empty and the
          # action aborts with "'toolchain' is a required input". Stating it
          # here makes the workflow independent of the action's defaults.
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            vectorvolt/target
          key: vectorvolt-${{ runner.os }}-${{ hashFiles('vectorvolt/Cargo.lock') }}
          restore-keys: vectorvolt-${{ runner.os }}-

      - name: Check formatting
        run: cargo fmt --manifest-path vectorvolt/Cargo.toml --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --manifest-path vectorvolt/Cargo.toml --all-targets -- -D warnings

      - name: Build tests (link one binary at a time)
        run: cargo test --manifest-path vectorvolt/Cargo.toml --all --no-run -j 1

      - name: Run tests
        run: cargo test --manifest-path vectorvolt/Cargo.toml --all

      - name: Disk usage
        if: always()
        run: df -h / && du -sh vectorvolt/target


  xdp:
    name: XDP on a real kernel (root, veth)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Create veth pair
        run: |
          sudo ip link add vvx0 type veth peer name vvx1
          sudo ip link set vvx0 up
          sudo ip link set vvx1 up

      - name: Build XDP tests
        run: cargo test --manifest-path vectorvolt/Cargo.toml -p vectorvolt-xdp --no-run

      # Loads the XSKMAP redirect program and moves frames over the veth pair;
      # needs CAP_BPF + CAP_NET_ADMIN, hence sudo.
      - name: Run XDP tests as root
        run: sudo env "PATH=$PATH" VV_XDP_VETH=vvx0,vvx1 cargo test --manifest-path vectorvolt/Cargo.toml -p vectorvolt-xdp -- --include-ignored --test-threads=1

  publish:
    name: Publish to crates.io
    if: startsWith(github.ref, 'refs/tags/vectorvolt-v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: vectorvolt-publish-${{ runner.os }}-${{ hashFiles('vectorvolt/Cargo.lock') }}

      # Publish in dependency order — wal first, then store
      - name: Publish vectorvolt-wal
        run: cargo publish -p vectorvolt-wal --manifest-path vectorvolt/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

      # crates.io needs a moment to index before dependents can resolve
      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish vectorvolt-store
        run: cargo publish -p vectorvolt-store --manifest-path vectorvolt/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
