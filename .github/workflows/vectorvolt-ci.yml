name: VectorVolt CI

on:
  push:
    branches: [main]
    tags: ["vectorvolt-v*"]
  pull_request:
    paths:
      - "vectorvolt/**"
      - ".github/workflows/vectorvolt-ci.yml"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # Explicit, even though the @stable ref implies it. The action reads
          # its default from action.yml at the resolved ref; when that ref is a
          # moving branch, an upstream change can leave the input empty and the
          # action aborts with "'toolchain' is a required input". Stating it
          # here makes the workflow independent of the action's defaults.
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            vectorvolt/target
          key: vectorvolt-${{ runner.os }}-${{ hashFiles('vectorvolt/Cargo.lock') }}
          restore-keys: vectorvolt-${{ runner.os }}-

      - name: Check formatting
        run: cargo fmt --manifest-path vectorvolt/Cargo.toml --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --manifest-path vectorvolt/Cargo.toml --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --manifest-path vectorvolt/Cargo.toml --all

  # ── Performance ─────────────────────────────────────────────────────────────
  #
  # Split into two very different checks, because they catch different things and
  # only one of them can be trusted on a shared runner.
  #
  # `cargo test` already runs the ALLOCATION GUARDS
  # (crates/vectorvolt-storage/tests/allocation_guard.rs). Those are deterministic
  # — they assert that decoding N rows allocates O(1) times, not O(N) — and they
  # are the real regression gate. They caught the `ok_or` bug at exactly 64000
  # allocations for 64000 rows, and they do not care how loaded the runner is.
  #
  # The benchmarks below are INFORMATIONAL and deliberately do not fail the build.
  bench:
    name: Benchmarks (informational)
    runs-on: ubuntu-latest
    # Only on PRs: the value is the base-vs-head comparison, and on a push to main
    # there is nothing to compare against.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          # Both sides of the comparison must run on the SAME runner in the same
          # job. GitHub-hosted runners vary enormously between machines and over
          # time, so comparing a number from this run against one recorded
          # yesterday measures the hardware, not the change.
          fetch-depth: 0

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            vectorvolt/target
          key: vectorvolt-bench-${{ runner.os }}-${{ hashFiles('vectorvolt/Cargo.lock') }}
          restore-keys: vectorvolt-bench-${{ runner.os }}-

      - name: Benchmark the merge base
        run: |
          git stash --include-untracked || true
          git checkout --detach ${{ github.event.pull_request.base.sha }}
          cargo bench --manifest-path vectorvolt/Cargo.toml -p vectorvolt-storage             --bench storage_bench -- --save-baseline base --warm-up-time 1             --measurement-time 3

      - name: Benchmark this branch and compare
        run: |
          git checkout --detach ${{ github.event.pull_request.head.sha }}
          cargo bench --manifest-path vectorvolt/Cargo.toml -p vectorvolt-storage             --bench storage_bench -- --baseline base --warm-up-time 1             --measurement-time 3 | tee bench.txt

      - name: Summarise
        run: |
          {
            echo "### Benchmark: this branch vs merge base"
            echo
            echo "Same runner, same session, so the comparison is meaningful even"
            echo "though the absolute numbers are not."
            echo
            echo '```'
            grep -E "time:|change:|Performance has" bench.txt || echo "no results"
            echo '```'
            echo
            echo "_Informational. The build is not gated on these — a shared runner"
            echo "is too noisy for a threshold that is both tight enough to catch a"
            echo "regression and loose enough not to flake. The allocation guards in"
            echo "\`cargo test\` are the gate that can be trusted._"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish to crates.io
    if: startsWith(github.ref, 'refs/tags/vectorvolt-v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: vectorvolt-publish-${{ runner.os }}-${{ hashFiles('vectorvolt/Cargo.lock') }}

      # Publish in dependency order — wal first, then store
      - name: Publish vectorvolt-wal
        run: cargo publish -p vectorvolt-wal --manifest-path vectorvolt/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

      # crates.io needs a moment to index before dependents can resolve
      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish vectorvolt-store
        run: cargo publish -p vectorvolt-store --manifest-path vectorvolt/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
