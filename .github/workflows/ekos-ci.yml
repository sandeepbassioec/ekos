name: EKOS CI

on:
  push:
    branches: [main]
    tags: ["ekos-v*"]
  pull_request:
    paths:
      - "ekos/**"
      - "vectorvolt/crates/vectorvolt-store/**"
      - "vectorvolt/crates/vectorvolt-wal/**"
      - ".github/workflows/ekos-ci.yml"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ekos/target
            vectorvolt/target
          key: ekos-${{ runner.os }}-${{ hashFiles('ekos/Cargo.lock', 'vectorvolt/Cargo.lock') }}
          restore-keys: ekos-${{ runner.os }}-

      - name: Check formatting
        run: cargo fmt --manifest-path ekos/Cargo.toml --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --manifest-path ekos/Cargo.toml --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --manifest-path ekos/Cargo.toml --all

  publish:
    name: Publish to crates.io
    if: startsWith(github.ref, 'refs/tags/ekos-v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ekos-publish-${{ runner.os }}-${{ hashFiles('ekos/Cargo.lock') }}

      # crates.io does not allow path dependencies in published crates.
      # Patch ekos workspace to reference vectorvolt-store by version instead.
      # vectorvolt-store must already be published before tagging ekos-v*.
      - name: Patch path dep → version dep for publish
        run: |
          VV_VERSION=$(cargo metadata --manifest-path vectorvolt/Cargo.toml --no-deps --format-version 1 \
            | python3 -c "import sys,json; pkgs=json.load(sys.stdin)['packages']; \
              print(next(p['version'] for p in pkgs if p['name']=='vectorvolt-store'))")
          echo "Patching vectorvolt-store path dep to version $VV_VERSION"
          sed -i "s|vectorvolt-store = { path = \"../vectorvolt/crates/vectorvolt-store\" }|vectorvolt-store = \"$VV_VERSION\"|" ekos/Cargo.toml

      - name: Publish ekos-kernel
        run: cargo publish -p ekos-kernel --manifest-path ekos/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish ekosd
        run: cargo publish -p ekosd --manifest-path ekos/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
