name: CI

# Temporarily disabled — re-enable once GitHub Actions billing is restored.
# on:
#   push:
#     branches: [main, develop]
#   pull_request:
#     branches: [main]
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Fast gate ──────────────────────────────────────────────────────────────
  # fmt + clippy on Linux only. Runs in ~1 min; blocks the matrix early so a
  # trivial formatting miss doesn't burn 3 OS runners.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all --check
        working-directory: vectorvolt
      # --all-targets covers lib, bins, tests, benches, and examples.
      # --all-features ensures feature-gated code is also linted.
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: vectorvolt

  # ── Rust tests (Linux + Windows) ──────────────────────────────────────────
  test:
    name: Test (${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --workspace --all-features
        working-directory: vectorvolt
      - name: Doc tests
        run: cargo test --workspace --doc
        working-directory: vectorvolt

  # ── Bench compile (no-run) ────────────────────────────────────────────────
  # Verifies that all Criterion bench harnesses compile in release mode.
  # Does NOT actually run the benchmarks (too slow for CI).
  bench-compile:
    name: Bench compile
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compile benchmarks
        run: cargo bench --no-run --workspace
        working-directory: vectorvolt

  # ── Rustdoc ───────────────────────────────────────────────────────────────
  # Ensures all public items are documented and doc-examples compile.
  docs:
    name: Docs
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build docs
        run: cargo doc --no-deps --workspace
        working-directory: vectorvolt
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken-intra-doc-links"

  # ── Release build smoke ───────────────────────────────────────────────────
  # Full --release build on pushes only (not every PR) to catch link errors
  # and LTO issues that only surface in release mode.
  release-smoke:
    name: Release build smoke
    needs: lint
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release --workspace
        working-directory: vectorvolt
