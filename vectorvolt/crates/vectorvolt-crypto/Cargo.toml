[package]
name        = "vectorvolt-crypto"
description = "Data-at-rest encryption and key storage for VectorVolt (VV-SEC-001..004)"
version.workspace   = true
authors.workspace   = true
edition.workspace   = true
license.workspace   = true

[dependencies]
thiserror = { workspace = true }
aes-gcm   = { workspace = true }
rand      = { workspace = true }
zeroize   = { workspace = true }
sha3      = { workspace = true }
tracing   = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# VirtualAlloc / VirtualLock for the key page (PP-55). Same version as
# vectorvolt-hal so no new crate enters the lockfile.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Memory"] }

[dev-dependencies]
tempfile = { workspace = true }
