[package]
name        = "vvctl"
description = "VectorVolt control plane CLI"
version.workspace    = true
authors.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
homepage.workspace   = true

[[bin]]
name = "vvctl"
path = "src/main.rs"

[lib]
name = "vvctl"
path = "src/lib.rs"

[dev-dependencies]
tempfile           = { workspace = true }
reqwest            = { workspace = true }
tokio              = { workspace = true }
serde_json         = { workspace = true }
vectorvolt-control = { path = "../vectorvolt-control" }
axum               = { workspace = true }

[dependencies]
vectorvolt-wal     = { path = "../vectorvolt-wal" }
vectorvolt-store   = { path = "../vectorvolt-store" }
vectorvolt-storage = { workspace = true }
vectorvolt-control = { path = "../vectorvolt-control" }
axum               = { workspace = true }
vectorvolt-engine = { workspace = true }
vectorvolt-net    = { workspace = true }
vectorvolt-http   = { workspace = true }
vectorvolt-hal   = { workspace = true }
vectorvolt-graph = { workspace = true }
tempfile         = { workspace = true }
bytes            = { workspace = true }
anyhow         = { workspace = true }
clap           = { workspace = true }
reqwest        = { workspace = true, features = ["blocking"] }
tokio          = { workspace = true }
tracing        = { workspace = true }
tracing-subscriber = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
serde_yaml     = { workspace = true }
toml           = { workspace = true }
chrono         = { workspace = true }
ctrlc        = "3.5.2"
hex          = "0.4.3"
getrandom    = { workspace = true }
comfy-table         = "7"
owo-colors          = "3"
indicatif           = "0.17"
dialoguer           = { workspace = true }
vectorvolt-query    = { workspace = true }
vectorvolt-vector   = { path = "../vectorvolt-vector" }
vectorvolt-reader   = { path = "../vectorvolt-reader" }
vectorvolt-chaos    = { workspace = true }
vectorvolt-ledger   = { workspace = true }
vectorvolt-xdp      = { workspace = true }
vectorvolt-crypto   = { workspace = true }
vectorvolt-server   = { path = "../vectorvolt-server" }
vectorvolt-tpm      = { workspace = true }
vectorvolt-otel     = { workspace = true }
tracing-opentelemetry = { workspace = true }
clap_complete       = { workspace = true }
zip                 = { workspace = true }
