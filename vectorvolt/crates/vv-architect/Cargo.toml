[package]
name        = "vv-architect"
version.workspace   = true
authors.workspace   = true
edition.workspace   = true
license.workspace   = true
repository.workspace = true
description = "Well-Architected Analyzer — scans an existing system and generates a VectorVolt deployment blueprint"

[[bin]]
name = "vv-architect"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
regex = "1"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
