[package]
name        = "vv-architect"
version.workspace   = true
authors.workspace   = true
edition.workspace   = true
license.workspace   = true
repository.workspace = true
description = "Well-Architected Analyzer — scans an existing system and generates a VectorVolt deployment blueprint"

[[bin]]
name = "vv-architect"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
walkdir = "2"
tree-sitter = "0.25"
tree-sitter-c-sharp = "0.23"
tree-sitter-java = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-rust = "0.24"
rusqlite = { version = "0.40.2", features = ["bundled"] }
# Python is deferred: its typical field idiom (self.x = ... inside __init__,
# or dataclass field annotations) doesn't fit the "field declared directly in
# a class body" shape the other 5 languages share — needs its own detection
# logic, not just another LanguageSupport table row. Add back when tackled.

[dev-dependencies]
serde_yaml.workspace = true
tempfile = "3"
