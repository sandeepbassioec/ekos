[package]
name        = "vectorvolt-sink"
description = "VectorVolt sink trait, registry, WAL bridge, Postgres and Kafka sinks"
version.workspace    = true
authors.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
homepage.workspace   = true

[dependencies]
vectorvolt-wal = { workspace = true }
vectorvolt-txn = { workspace = true }
vectorvolt-crypto = { workspace = true }
thiserror      = { workspace = true }
parking_lot    = { workspace = true }
serde_json     = { workspace = true }
async-trait    = "0.1"
tokio          = { workspace = true }
tokio-postgres = { workspace = true }
rskafka        = { workspace = true }
chrono         = { workspace = true }
rustls         = { workspace = true }
tokio-rustls   = { workspace = true }
rustls-pemfile = { workspace = true }
webpki-roots   = { workspace = true }

[features]
default = ["compression-gzip", "compression-snappy", "compression-lz4", "compression-zstd"]
compression-gzip   = ["rskafka/compression-gzip"]
compression-snappy = ["rskafka/compression-snappy"]
compression-lz4    = ["rskafka/compression-lz4"]
compression-zstd   = ["rskafka/compression-zstd"]

[dev-dependencies]
tempfile = { workspace = true }
