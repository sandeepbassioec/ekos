[workspace]
members = [
    "crates/vectorvolt-hal",
    "crates/vectorvolt-wal",
    "crates/vectorvolt-store",
    "crates/vectorvolt-index",
    "crates/vectorvolt-storage",
    "crates/vectorvolt-query",
    "crates/vectorvolt-txn",
    "crates/vectorvolt-engine",
    "crates/vectorvolt-net",
    "crates/vvctl",
]
resolver = "2"

[workspace.package]
version     = "0.1.0"
authors     = ["WorkerRuntime <hello@workerruntime.com>"]
edition     = "2024"
license     = "Apache-2.0"
repository  = "https://github.com/workerruntime/vectorvolt"
homepage    = "https://workerruntime.com"
description = "VectorVolt — ultra-low-latency kernel-bypass data engine"

[workspace.dependencies]
# async
tokio          = { version = "1.45", features = ["full"] }
# error handling
anyhow         = "1.0"
thiserror      = "2.0"
# hashing
sha3           = "0.10"
crc32fast      = "1.4"
# bytes / encoding
bytes          = "1.10"
byteorder      = "1.5"
# concurrency
parking_lot    = "0.12"
crossbeam-channel = "0.5"
# CLI
clap           = { version = "4.5", features = ["derive", "color"] }
# logging / tracing
tracing        = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# time
chrono         = { version = "0.4", features = ["serde"] }
# serialization
serde          = { version = "1.0", features = ["derive"] }
serde_json     = "1.0"
# bitmap / probabilistic
roaring        = "0.10"
# compression (cold-tier storage)
lz4_flex       = { version = "0.11", default-features = false, features = ["std"] }
# memory-mapped I/O
memmap2        = "0.9"
# internal crates
vectorvolt-hal     = { path = "crates/vectorvolt-hal" }
vectorvolt-wal     = { path = "crates/vectorvolt-wal" }
vectorvolt-index   = { path = "crates/vectorvolt-index" }
vectorvolt-storage = { path = "crates/vectorvolt-storage" }
vectorvolt-query   = { path = "crates/vectorvolt-query" }
vectorvolt-txn     = { path = "crates/vectorvolt-txn" }
vectorvolt-engine  = { path = "crates/vectorvolt-engine" }
vectorvolt-net     = { path = "crates/vectorvolt-net" }
# testing
tempfile       = "3.14"

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"

[profile.bench]
inherits  = "release"
debug     = true
strip     = "none"
