[workspace]
members = [
    "crates/vectorvolt-hal",
    "crates/vectorvolt-wal",
    "crates/vectorvolt-store",
    "crates/vectorvolt-index",
    "crates/vectorvolt-storage",
    "crates/vectorvolt-query",
    "crates/vectorvolt-replication",
    "crates/vectorvolt-txn",
    "crates/vectorvolt-engine",
    "crates/vectorvolt-projection",
    "crates/vectorvolt-sink",
    "crates/vectorvolt-sink-sdk",
    "crates/vectorvolt-net",
    "crates/vectorvolt-server",
    "crates/vectorvolt-http",
    "crates/vvctl",
    "crates/vectorvolt-cluster",
    "crates/vectorvolt-control",
    "crates/vectorvolt-sdk",
    "crates/vectorvolt-reader",
    "crates/vectorvolt-vector",
    "crates/vectorvolt-graph",
]
resolver = "2"

[workspace.package]
version     = "0.1.0"
authors     = ["WorkerRuntime <hello@workerruntime.com>"]
edition     = "2024"
license     = "Apache-2.0"
repository  = "https://github.com/workerruntime/vectorvolt"
homepage    = "https://workerruntime.com"
description = "VectorVolt — ultra-low-latency kernel-bypass data engine"

[workspace.dependencies]
# async
tokio          = { version = "1.45", features = ["full"] }
axum           = { version = "0.8", default-features = false, features = ["json", "tokio", "http1", "query"] }
tokio-stream   = { version = "0.1", features = ["sync"] }
tower          = { version = "0.5", default-features = false }
reqwest        = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# error handling
anyhow         = "1.0"
thiserror      = "2.0"
# hashing
getrandom      = "0.3"
subtle         = "2.6"
sha3           = "0.10"
crc32fast      = "1.4"
# bytes / encoding
bytes          = "1.10"
byteorder      = "1.5"
# concurrency
parking_lot    = "0.12"
crossbeam-channel = "0.5"
# CLI
clap           = { version = "4.5", features = ["derive", "color"] }
# logging / tracing
tracing        = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# time
chrono         = { version = "0.4", features = ["serde"] }
# serialization
serde          = { version = "1.0", features = ["derive"] }
serde_json     = "1.0"
serde_yaml     = "0.9"
toml           = { version = "0.8", features = ["parse"] }
# bitmap / probabilistic
roaring        = "0.10"
# compression (cold-tier storage)
lz4_flex       = { version = "0.11", default-features = false, features = ["std"] }
zstd           = { version = "0.13", default-features = false }
# benchmarking
criterion      = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
# TLS
rustls         = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pemfile = "2.2"
rcgen          = "0.13"
# memory-mapped I/O
memmap2        = "0.9"
# internal crates
vectorvolt-hal     = { path = "crates/vectorvolt-hal" }
vectorvolt-wal     = { path = "crates/vectorvolt-wal" }
vectorvolt-index   = { path = "crates/vectorvolt-index" }
vectorvolt-storage = { path = "crates/vectorvolt-storage" }
vectorvolt-query       = { path = "crates/vectorvolt-query" }
vectorvolt-replication = { path = "crates/vectorvolt-replication" }
vectorvolt-txn     = { path = "crates/vectorvolt-txn" }
vectorvolt-engine      = { path = "crates/vectorvolt-engine" }
vectorvolt-projection  = { path = "crates/vectorvolt-projection" }
vectorvolt-sink        = { path = "crates/vectorvolt-sink" }
vectorvolt-sink-sdk    = { path = "crates/vectorvolt-sink-sdk" }
vectorvolt-net     = { path = "crates/vectorvolt-net" }
vectorvolt-http    = { path = "crates/vectorvolt-http" }
vectorvolt-cluster = { path = "crates/vectorvolt-cluster" }
vectorvolt-control = { path = "crates/vectorvolt-control" }
vectorvolt-sdk     = { path = "crates/vectorvolt-sdk" }
vectorvolt-reader  = { path = "crates/vectorvolt-reader" }
vectorvolt-vector  = { path = "crates/vectorvolt-vector" }
vectorvolt-graph   = { path = "crates/vectorvolt-graph" }
rayon              = "1.10"
# testing
tempfile       = "3.14"

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"

[profile.bench]
inherits  = "release"
debug     = true
strip     = "none"
