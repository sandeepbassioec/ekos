# Cargo configuration for VectorVolt workspace.
# Adds the MSVC lib and linker paths needed when building from a plain
# PowerShell session (i.e. without first running vcvarsall.bat).

[target.x86_64-pc-windows-msvc]
linker = "C:\\Program Files\\Microsoft Visual Studio\\2022\\Professional\\VC\\Tools\\MSVC\\14.44.35207\\bin\\Hostx64\\x64\\link.exe"

[env]
# Windows SDK and MSVC runtime libs — required when not launched from
# "Developer PowerShell for VS 2022".
#
# force = false (the default) means Cargo only sets these if they are NOT
# already present in the environment.  On Linux, set CC=gcc in your shell
# (or ~/.cargo/config.toml) so Cargo leaves it alone.
LIB = { value = "C:\\Program Files\\Microsoft Visual Studio\\2022\\Professional\\VC\\Tools\\MSVC\\14.44.35207\\lib\\x64;C:\\Program Files (x86)\\Windows Kits\\10\\Lib\\10.0.26100.0\\ucrt\\x64;C:\\Program Files (x86)\\Windows Kits\\10\\Lib\\10.0.26100.0\\um\\x64", force = false }

# C compiler for crates with a C component (zstd-sys, ring, etc.).
# force = false → Linux builds that already have CC=gcc in the environment
# will not be overridden.  Run: export CC=gcc before cargo on Linux.
CC = { value = "C:\\Program Files\\Microsoft Visual Studio\\2022\\Professional\\VC\\Tools\\MSVC\\14.44.35207\\bin\\Hostx64\\x64\\cl.exe", force = false }
INCLUDE = { value = "C:\\Program Files\\Microsoft Visual Studio\\2022\\Professional\\VC\\Tools\\MSVC\\14.44.35207\\include;C:\\Program Files (x86)\\Windows Kits\\10\\Include\\10.0.26100.0\\ucrt;C:\\Program Files (x86)\\Windows Kits\\10\\Include\\10.0.26100.0\\um;C:\\Program Files (x86)\\Windows Kits\\10\\Include\\10.0.26100.0\\shared", force = false }
