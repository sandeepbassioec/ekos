# VectorVolt / EKOS Requirements Traceability Catalog
#
# Every requirement in this file must link to:
#   - At least one architecture document section  (arch)
#   - Zero or more ADRs                           (adrs)
#   - One or more source files                    (code)
#   - One or more test identifiers                (tests)
#
# Status values:
#   draft        — captured, not yet started
#   in_progress  — implementation underway
#   implemented  — code written, tests passing
#   verified     — independently verified / reviewed
#
# ID scheme:
#   VV-WAL-nnn   VectorVolt WAL
#   VV-GCB-nnn   VectorVolt GroupCommitBatcher
#   VV-STR-nnn   VectorVolt Storage Engine
#   VV-PRJ-nnn   VectorVolt Projection / Scan
#   VV-PKG-nnn   VectorVolt Packaging / CI
#   EKOS-KNL-nnn EKOS Knowledge Kernel
#   EKOS-API-nnn EKOS Syscall / API layer
#   EKOS-CCR-nnn EKOS CCR enforcement
#   EKOS-FED-nnn EKOS Federation / Edge
#   ESIP-UI-nnn  ESIP React application

